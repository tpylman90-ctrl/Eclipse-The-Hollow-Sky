name: Eclipse Blender - Original Baked Asset Foundry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/eclipse-blender-baked-assets
    paths:
      - 'experiments/eclipse-stride/blender/**'
      - '.github/workflows/eclipse-blender-assets.yml'
      - 'experiments/eclipse-stride/source/**'
      - 'experiments/eclipse-stride/build-eclipse.ps1'

permissions:
  contents: read

concurrency:
  group: eclipse-blender-asset-foundry
  cancel-in-progress: true

jobs:
  blender-bake:
    name: Build Blender hard-surface assets and bake UV atlases
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install free Blender CPU build
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version
      - name: Generate original game assets and pre-bake textures
        run: |
          mkdir -p experiments/eclipse-stride/.generated/blender
          blender --background --factory-startup --python-exit-code 1 \
            --python experiments/eclipse-stride/blender/build_assets.py -- \
            --out experiments/eclipse-stride/.generated/blender
      - name: Verify GLBs, baked PNGs and poly budgets
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path('experiments/eclipse-stride/.generated/blender')
          data=json.loads((root/'manifest.json').read_text())
          assert len(data['assets']) == 2
          for asset in data['assets']:
              name=asset['asset']
              mesh=root/(name+'.glb')
              raw=mesh.read_bytes()
              assert raw[:4]==b'glTF', (name,'GLB header invalid')
              assert struct.unpack('<I',raw[8:12])[0]==len(raw), (name,'GLB size mismatch')
              assert asset['triangles'] < 35000
              for texture in asset['textures']+[asset['preview']]:
                  p=root/texture
                  assert p.stat().st_size>1000, str(p)
                  assert p.open('rb').read(8)==bytes.fromhex('89504e470d0a1a0a')
              print(name,'tris',asset['triangles'],'GLB bytes',len(raw))
          PY
      - name: Publish Blender GLBs, pre-baked atlases, previews and manifest
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-blender-original-baked-assets
          path: experiments/eclipse-stride/.generated/blender/
          if-no-files-found: error
          retention-days: 30

  android-with-blender:
    name: Compile baked Blender models into Stride v4 Android
    needs: blender-bake
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
      - name: Download validated Blender models and textures
        uses: actions/download-artifact@v4
        with:
          name: eclipse-blender-original-baked-assets
          path: experiments/eclipse-stride/.generated/blender-input
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Android Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Windows build and Blender importer syntax
        shell: pwsh
        run: |
          foreach ($file in @(
            "experiments/eclipse-stride/build-eclipse.ps1",
            "experiments/eclipse-stride/blender/import-baked-assets.ps1"
          )) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "Invalid PowerShell source $file"
            }
          }
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { throw "Android workload unavailable" }
      - name: Build and sign baked-asset Eclipse v4 APK
        shell: pwsh
        run: |
          $env:ECLIPSE_BAKED_ASSETS = Join-Path $pwd "experiments/eclipse-stride/.generated/blender-input"
          ./experiments/eclipse-stride/build-eclipse.ps1
      - name: Archive signed game APK and reproducible imported Stride source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-stride-blender-v4-android
          path: experiments/eclipse-stride/.generated/artifacts/
          if-no-files-found: warn
          retention-days: 30
