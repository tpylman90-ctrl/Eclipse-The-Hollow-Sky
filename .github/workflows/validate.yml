name: Validate and build Eclipse prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eclipse-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Engine information
        run: godot --version
      - name: Check scripts individually
        shell: bash
        run: |
          set -e
          for script in scripts/*.gd; do
            echo "Checking ${script}"
            godot --headless --path . --check-only --script "res://${script}"
          done
      - name: Import and script validation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/eclipse-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource' /tmp/eclipse-import.log; then
            echo "Game script import failed"
            exit 1
          fi
      - name: Boot main scene for ninety frames
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 90 2>&1 | tee /tmp/eclipse-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' /tmp/eclipse-smoke.log; then
            echo "Runtime smoke test failed"
            exit 1
          fi

  gameplay-smoke:
    needs: godot-smoke
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Validate a full combat and sector progression loop
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_sortie.gd 2>&1 | tee /tmp/eclipsegameplay.log
          grep -q "ECLIPSE GAMEPLAY SMOKE: PASS" /tmp/eclipsegameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:.*(GDScript|script|scene)' /tmp/eclipsegameplay.log; then
            exit 1
          fi

  android-debug:
    needs: [godot-smoke, gameplay-smoke]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore container export templates and Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -f "$HOME/.config/godot/editor_settings-4.5.tres"
      - name: Import resources
        run: godot --headless --path . --editor --import --quit
      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/Eclipse-The-Hollow-Sky-debug.apk
          test -s build/android/Eclipse-The-Hollow-Sky-debug.apk
      - name: Save Android test build
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-hollow-sky-android-debug
          path: build/android/Eclipse-The-Hollow-Sky-debug.apk
          if-no-files-found: error
          retention-days: 14
