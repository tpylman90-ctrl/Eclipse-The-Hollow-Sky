name: Stride Android Graphics Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stride-graphics-test.yml'
      - 'experiments/stride-graphics-test/**'

permissions:
  contents: read

jobs:
  android-graphics-smoke:
    name: Stride 4.4.3 / Windows-hosted Android APK
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Check out Eclipse repository
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { throw "Android workload installation failed" }
      - name: Generate scene and build Stride Android graphics APK
        shell: pwsh
        run: |
          ./experiments/stride-graphics-test/build-windows.ps1
      - name: Upload APK and generated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stride-android-graphics-test
          path: experiments/stride-graphics-test/.generated/artifacts/
          if-no-files-found: warn
          retention-days: 7
